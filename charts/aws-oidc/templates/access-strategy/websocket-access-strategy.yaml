{{- if .Values.accessStrategy.createWebSocket }}
apiVersion: workspace.jupyter.org/v1alpha1
kind: WorkspaceAccessStrategy
metadata:
  name: websocket-access-strategy
  namespace: {{ .Values.accessStrategy.namespace }}
spec:
  displayName: JupyterLab Routing Strategy with WebSocket remote access
  createConnectionHandler: "k8s-native"
  accessResourceTemplates:
    {{- if .Values.accessStrategy.createNetworkPolicy }}
    - kind: NetworkPolicy
      apiVersion: networking.k8s.io/v1
      namePrefix: workspace-network-policy
      template: |
        spec:
          podSelector:
            matchLabels:
              workspace.jupyter.org/workspaceName: "{{`{{ .Workspace.Name }}`}}"
          policyTypes:
          - Ingress
          ingress:
          - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: {{ .Values.namespace }}
              podSelector:
                matchLabels:
                  app: traefik
                  component: router
            ports:
            - port: 8888
              protocol: TCP
            - port: {{ .Values.accessStrategy.webSocket.port }}
              protocol: TCP
          - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: jupyter-k8s-system
            ports:
            - port: 8888
              protocol: TCP
            - port: {{ .Values.accessStrategy.webSocket.port }}
              protocol: TCP
    {{- end }}
    - kind: IngressRoute
      apiVersion: traefik.io/v1alpha1
      namePrefix: websocket-route
      template: |
        spec:
          entryPoints:
            - websecure
          routes:
            - match: "Host(`{{ .Values.domain }}`) && PathPrefix(`/workspaces/{{`{{ .Workspace.Namespace }}`}}/{{`{{ .Workspace.Name }}`}}/ssh-ws`)"
              kind: Rule
              priority: 120
              middlewares:
                - name: auth-headers
                  namespace: {{ .Values.namespace }}
                - name: authmiddleware-bearer-auth
                  namespace: {{ .Values.namespace }}
              services:
                - name: "{{`{{ .Service.Name }}`}}"
                  namespace: "{{`{{ .Service.Namespace }}`}}"
                  port: {{ .Values.accessStrategy.webSocket.port }}
    - kind: IngressRoute
      apiVersion: traefik.io/v1alpha1
      namePrefix: authorized-route
      template: |
        spec:
          entryPoints:
            - websecure
          routes:
            - match: "Host(`{{ .Values.domain }}`) && PathPrefix(`/workspaces/{{`{{ .Workspace.Namespace }}`}}/{{`{{ .Workspace.Name }}`}}/`)"
              kind: Rule
              priority: 100
              middlewares:
                - name: auth-headers
                  namespace: {{ .Values.namespace }}
                - name: authmiddleware-verify
                  namespace: {{ .Values.namespace }}
              services:
                - name: "{{`{{ .Service.Name }}`}}"
                  namespace: "{{`{{ .Service.Namespace }}`}}"
                  port: 8888
    - kind: IngressRoute
      apiVersion: traefik.io/v1alpha1
      namePrefix: bearer-auth-route
      template: |
        spec:
          entryPoints:
            - websecure
          routes:
            - match: "Host(`{{ .Values.domain }}`) && PathPrefix(`/workspaces/{{`{{ .Workspace.Namespace }}`}}/{{`{{ .Workspace.Name }}`}}/bearer-auth`)"
              kind: Rule
              priority: 110
              middlewares:
                - name: auth-headers
                  namespace: {{ .Values.namespace }}
                - name: authmiddleware-bearer-auth
                  namespace: {{ .Values.namespace }}
                - name: strip-bearer-auth-suffix
                  namespace: {{ .Values.namespace }}
              services:
                - name: "{{`{{ .Service.Name }}`}}"
                  namespace: "{{`{{ .Service.Namespace }}`}}"
                  port: 8888
  deploymentModifications:
    podModifications:
      additionalContainers:
        - name: {{ .Values.accessStrategy.webSocket.containerName }}
          image: "{{ .Values.accessStrategy.webSocket.image.repository }}/{{ .Values.accessStrategy.webSocket.image.imageName }}:{{ .Values.accessStrategy.webSocket.image.imageTag }}"
          imagePullPolicy: {{ .Values.accessStrategy.webSocket.image.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
              - ALL
          ports:
            - name: {{ .Values.accessStrategy.webSocket.portName }}
              containerPort: {{ .Values.accessStrategy.webSocket.port }}
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":{{ .Values.accessStrategy.webSocket.port }}"
            - name: TARGET_HOST
              value: "{{ .Values.accessStrategy.webSocket.targetHost }}"
            - name: TARGET_PORT
              value: "{{ .Values.accessStrategy.webSocket.targetPort }}"
            - name: MAX_SESSION_DURATION
              value: "{{ .Values.accessStrategy.webSocket.maxSessionDuration }}"
            - name: MAX_CONNECTIONS
              value: "{{ .Values.accessStrategy.webSocket.maxConnections }}"
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.accessStrategy.webSocket.port }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.accessStrategy.webSocket.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.accessStrategy.webSocket.resources | nindent 12 }}
      exposedPorts:
        - {{ .Values.accessStrategy.webSocket.portName }}
      primaryContainerModifications:
        mergeEnv:
          - name: JUPYTER_BASE_URL
            valueTemplate: "/workspaces/{{`{{ .Workspace.Namespace }}`}}/{{`{{ .Workspace.Name }}`}}/"
  applicationBasePathTemplate: "/workspaces/{{`{{ .Workspace.Namespace }}`}}/{{`{{ .Workspace.Name }}`}}/"
  accessURLTemplate: "https://{{ .Values.domain }}/workspaces/{{`{{ .Workspace.Namespace }}`}}/{{`{{ .Workspace.Name }}`}}/"
  bearerAuthURLTemplate: "https://{{ .Values.domain }}/workspaces/{{`{{ .Workspace.Namespace }}`}}/{{`{{ .Workspace.Name }}`}}/bearer-auth"
  webSocketURLTemplate: "https://{{ .Values.domain }}/workspaces/{{`{{ .Workspace.Namespace }}`}}/{{`{{ .Workspace.Name }}`}}/ssh-ws"
  accessStartupProbe:
    httpGet:
      urlTemplate: "https://{{ .Values.domain }}/workspaces/{{`{{ .Workspace.Namespace }}`}}/{{`{{ .Workspace.Name }}`}}/bearer-auth"
      additionalSuccessStatusCodes: [400]
    initialDelaySeconds: 1
    periodSeconds: 2
    failureThreshold: 20
{{- end }}
